<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SearchKarigar</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#222;
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.btn{
    background:#0d6efd;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

.feed{
    padding:15px;
}

.post{
    background:white;
    padding:15px;
    border-radius:8px;
    margin-bottom:12px;
    box-shadow:0 1px 5px rgba(0,0,0,0.1);
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:20px;
}
</style>
</head>

<body>

<header>
    <div class="logo">SearchKarigar</div>

    <div>
        <button class="btn">Login</button>
        <button class="btn">Register</button>
    </div>
</header>

<div class="feed">

    <div class="post">
        Welcome to SearchKarigar.<br><br>
        Footwear Industry ke Karigar aur Factory Owners ko jodne wala platform.
    </div>

</div>

<footer>
    Material rates aur updates yahan dikhaye jayenge.
</footer>

</body>
</html>
